plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.monitor.health'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.monitor.health"
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName "15.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.wear

    implementation libs.firebase.messaging

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.squareup.retrofit2:retrofit:2.8.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.8.1'

    // Chat real-time delivery — connects to the same socketio relay familyhealth-app/the React
    // SPA use. Exclude org.json: Android already ships it on the boot classpath, and without this
    // exclude the two collide at build time ("duplicate class org.json.*").
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.airbnb.android:lottie:6.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.conscrypt:conscrypt-android:2.6.3'

    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'  // or latest

    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.material:material:1.12.0'


    // Twilio Video Android SDK (from Maven Central)
    implementation 'com.twilio:video-android:7.9.0'

    // Twilio Voice Android SDK (VoIP)
    implementation 'com.twilio:voice-android:6.10.4'

    // LiveKit Android SDK — verify this is still the current release before building:
    // https://github.com/livekit/client-sdk-android/releases
    implementation 'io.livekit:livekit-android:2.11.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // OneSignal Android SDK — same version-range convention OneSignal's own docs recommend.
    implementation 'com.onesignal:OneSignal:[5.1.0, 5.99.99]'

    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

}